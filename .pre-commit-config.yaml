# Optional: `uv run pre-commit install` (pre-commit is pinned in uv.lock).
# Uses the repository's own scripts through uv so pre-commit, CMake and CI agree exactly.
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (check)
        entry: uv run --frozen python scripts/run_clang_format.py --check
        language: system
        pass_filenames: false
        types_or: [c++, c]
      - id: file-length
        name: file-length policy
        entry: uv run --frozen python scripts/check_file_length.py
        language: system
        pass_filenames: false
        types_or: [c++, c]
      - id: layering
        name: layering rules
        entry: uv run --frozen python scripts/check_layering.py
        language: system
        pass_filenames: false
        types_or: [c++, c]
